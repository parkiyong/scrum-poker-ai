<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrum Poker AI - UI & State Flow Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
    .card-flip { transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

  <!-- TOP APP HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-3 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/20">
        🃏
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-sm tracking-wide text-slate-200">Scrum Poker AI</h1>
          <span class="px-2 py-0.5 text-xs bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 rounded-full font-mono">swift-badger-42</span>
        </div>
        <p class="text-xs text-slate-400">Zero-Auth Room • Standalone Mode</p>
      </div>
    </div>

    <!-- SIMULATION CONTROL BAR -->
    <div class="flex items-center gap-2 bg-slate-800/80 p-1.5 rounded-lg border border-slate-700">
      <span class="text-xs text-slate-400 font-semibold px-2">Simulate State:</span>
      <button onclick="setSimState('story_doctor')" id="btn-state-doctor" class="px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">1. Story Doctor</button>
      <button onclick="setSimState('voting')" id="btn-state-voting" class="px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">2. Voting</button>
      <button onclick="setSimState('revealed_spread')" id="btn-state-spread" class="px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">3. Reveal (Spread)</button>
      <button onclick="setSimState('revealed_consensus')" id="btn-state-consensus" class="px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">4. Consensus</button>
      <button onclick="setSimState('slicing')" id="btn-state-slicing" class="px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-200 hover:bg-slate-600">5. SPIDR Slice</button>
    </div>

    <!-- USER BADGE -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span class="font-medium text-slate-200">Alex (Facilitator)</span>
      </div>
      <button class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition text-slate-300 flex items-center gap-1.5">
        <i class="fa-solid fa-share-nodes"></i> Share Room (SWB-42)
      </button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app-root" class="flex-1 flex flex-col p-6 max-w-7xl mx-auto w-full pb-24">
    <!-- Rendered dynamically by Variant -->
  </main>

  <!-- FLOATING PROTOTYPE SWITCHER (Mandatory per prototype skill) -->
  <aside class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-900/95 border-2 border-indigo-500/60 shadow-2xl shadow-indigo-500/30 rounded-full px-5 py-2.5 flex items-center gap-4 z-50 backdrop-blur">
    <button onclick="prevVariant()" class="p-1.5 text-slate-400 hover:text-white transition rounded-full hover:bg-slate-800">
      <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="text-center min-w-[280px]">
      <span class="text-xs uppercase tracking-wider text-indigo-400 font-bold">UI Variation</span>
      <div id="variant-label" class="text-sm font-semibold text-white">Variant A: Arena Poker Table</div>
    </div>
    <button onclick="nextVariant()" class="p-1.5 text-slate-400 hover:text-white transition rounded-full hover:bg-slate-800">
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </aside>

  <script>
    // State model
    const state = {
      variant: 'A',
      phase: 'revealed_spread', // 'story_doctor' | 'voting' | 'revealed_spread' | 'revealed_consensus' | 'slicing'
      selectedCard: '5',
      story: {
        id: 'story-101',
        title: 'Zero-Downtime Session Store Migration',
        description: 'Migrate active user sessions from in-memory cache to distributed PostgreSQL with seamless reconnect and token validation.',
        ac: [
          'User sessions survive server restart without logout',
          'Token refresh operates within <50ms latency SLA',
          'Backward compatible with existing client localStorage UUIDs'
        ],
        readiness: 88,
        complexity: {
          data: 'New session & token tables with composite index on (room_slug, participant_id)',
          apis: 'WebSocket handshake validator & cleanup cron actor',
          blast: 'High concurrency connection spikes during rolling deployment'
        },
        edgeCases: [
          'Expired session token reconnect during live vote round',
          'Multiple tabs with same participant UUID voting simultaneously',
          'Network packet dropped right before card reveal'
        ]
      },
      participants: [
        { id: '1', name: 'Alex (You)', role: 'Facilitator', voted: true, vote: '5', color: 'indigo' },
        { id: '2', name: 'Sarah', role: 'Estimator', voted: true, vote: '5', color: 'emerald' },
        { id: '3', name: 'Devon', role: 'Estimator', voted: true, vote: '3', color: 'amber' },
        { id: '4', name: 'Elena', role: 'Estimator', voted: true, vote: '13', color: 'rose' },
        { id: '5', name: 'Marcus', role: 'Observer', voted: false, vote: null, color: 'slate' }
      ],
      deck: ['1', '2', '3', '5', '8', '13', '21', '?']
    };

    const variants = [
      { key: 'A', name: 'Variant A: Arena Poker Table' },
      { key: 'B', name: 'Variant B: Split Command Center' },
      { key: 'C', name: 'Variant C: Streamlined Minimalist' }
    ];

    function setSimState(phase) {
      state.phase = phase;
      // Adjust votes according to phase
      if (phase === 'revealed_consensus') {
        state.participants.forEach(p => { if (p.role === 'Estimator' || p.id === '1') p.vote = '5'; });
      } else if (phase === 'revealed_spread') {
        state.participants[0].vote = '5';
        state.participants[1].vote = '5';
        state.participants[2].vote = '3';
        state.participants[3].vote = '13';
      }
      render();
    }

    function prevVariant() {
      const idx = variants.findIndex(v => v.key === state.variant);
      const nextIdx = (idx - 1 + variants.length) % variants.length;
      state.variant = variants[nextIdx].key;
      render();
    }

    function nextVariant() {
      const idx = variants.findIndex(v => v.key === state.variant);
      const nextIdx = (idx + 1) % variants.length;
      state.variant = variants[nextIdx].key;
      render();
    }

    document.addEventListener('keydown', (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
      if (e.key === 'ArrowLeft') prevVariant();
      if (e.key === 'ArrowRight') nextVariant();
    });

    function render() {
      // Update switcher label
      const current = variants.find(v => v.key === state.variant);
      document.getElementById('variant-label').textContent = current.name;

      // Update simulation button styles
      ['doctor', 'voting', 'spread', 'consensus', 'slicing'].forEach(k => {
        const btn = document.getElementById(`btn-state-${k}`);
        if (btn) {
          const active = (k === 'doctor' && state.phase === 'story_doctor') ||
                         (k === 'voting' && state.phase === 'voting') ||
                         (k === 'spread' && state.phase === 'revealed_spread') ||
                         (k === 'consensus' && state.phase === 'revealed_consensus') ||
                         (k === 'slicing' && state.phase === 'slicing');
          btn.className = active
            ? "px-2.5 py-1 text-xs rounded font-medium transition bg-indigo-600 text-white shadow-md shadow-indigo-500/30"
            : "px-2.5 py-1 text-xs rounded font-medium transition bg-slate-700 text-slate-300 hover:bg-slate-600";
        }
      });

      const root = document.getElementById('app-root');
      if (state.variant === 'A') root.innerHTML = renderVariantA();
      else if (state.variant === 'B') root.innerHTML = renderVariantB();
      else if (state.variant === 'C') root.innerHTML = renderVariantC();
    }

    // ==========================================
    // VARIANT A: ARENA POKER TABLE (Center Arena)
    // ==========================================
    function renderVariantA() {
      const isRevealed = state.phase === 'revealed_spread' || state.phase === 'revealed_consensus' || state.phase === 'slicing';
      return `
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6 flex-1">
          <!-- MAIN POKER ARENA (3 Cols) -->
          <div class="lg:col-span-3 flex flex-col gap-6">
            
            <!-- STORY CARD HEADER -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
              <div class="flex items-start justify-between gap-4">
                <div>
                  <span class="text-xs font-semibold text-indigo-400 uppercase tracking-wider">Current Story (1 of 6)</span>
                  <h2 class="text-xl font-bold text-white mt-1">${state.story.title}</h2>
                  <p class="text-sm text-slate-300 mt-1">${state.story.description}</p>
                </div>
                <div class="flex items-center gap-2">
                  <span class="px-2.5 py-1 rounded-lg text-xs font-bold ${state.story.readiness >= 80 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-amber-500/10 text-amber-400'}">
                    INVEST: ${state.story.readiness}%
                  </span>
                  <button class="p-2 text-slate-400 hover:text-white bg-slate-800 rounded-lg border border-slate-700">
                    <i class="fa-solid fa-list-check"></i>
                  </button>
                </div>
              </div>

              <!-- ACCEPTANCE CRITERIA -->
              <div class="mt-4 pt-3 border-t border-slate-800/80 flex flex-wrap gap-2 text-xs text-slate-400">
                <span class="font-semibold text-slate-300">Acceptance Criteria:</span>
                ${state.story.ac.map(a => `<span class="bg-slate-800/60 px-2 py-0.5 rounded border border-slate-700/50">✓ ${a}</span>`).join('')}
              </div>
            </div>

            <!-- VIRTUAL POKER TABLE -->
            <div class="flex-1 bg-gradient-to-b from-slate-900 to-slate-950 border-2 border-slate-800/80 rounded-3xl p-8 flex flex-col items-center justify-between relative min-h-[360px] shadow-2xl">
              
              <!-- TOP PARTICIPANTS -->
              <div class="flex gap-8 z-10">
                ${renderParticipantCard(state.participants[1], isRevealed)}
                ${renderParticipantCard(state.participants[2], isRevealed)}
              </div>

              <!-- TABLE CENTER AREA -->
              <div class="w-72 h-36 rounded-full border-2 border-indigo-500/30 bg-slate-800/40 backdrop-blur flex flex-col items-center justify-center p-4 text-center relative shadow-inner">
                ${state.phase === 'voting' ? `
                  <div class="flex items-center gap-2 text-indigo-400 font-bold animate-pulse text-sm">
                    <i class="fa-solid fa-lock"></i> Private Voting Active
                  </div>
                  <p class="text-xs text-slate-400 mt-1">4 of 4 Estimators Voted</p>
                  <button class="mt-3 px-4 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg shadow-lg shadow-indigo-600/30 transition">
                    Flip Cards
                  </button>
                ` : isRevealed ? `
                  <span class="text-xs uppercase text-slate-400 font-semibold tracking-wider">Vote Outcome</span>
                  <div class="text-3xl font-black text-white mt-0.5">
                    ${state.phase === 'revealed_consensus' ? '5 Points' : 'Spread (3–13)'}
                  </div>
                  <span class="text-xs font-medium ${state.phase === 'revealed_consensus' ? 'text-emerald-400' : 'text-rose-400'} mt-1">
                    ${state.phase === 'revealed_consensus' ? '✓ High Consensus (100%)' : '⚠ Divergence Detected'}
                  </span>
                ` : `
                  <span class="text-xs text-slate-400">Story Doctor Review Phase</span>
                `}
              </div>

              <!-- BOTTOM PARTICIPANTS (You + Elena) -->
              <div class="flex gap-8 z-10">
                ${renderParticipantCard(state.participants[0], isRevealed)}
                ${renderParticipantCard(state.participants[3], isRevealed)}
              </div>
            </div>

            <!-- CARD DECK SELECTION BAR -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
              <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Your Estimate:</span>
              <div class="flex gap-2">
                ${state.deck.map(val => `
                  <button onclick="state.selectedCard = '${val}'; render();" class="w-12 h-16 rounded-xl font-bold text-lg transition-all transform hover:-translate-y-1 flex flex-col items-center justify-center ${state.selectedCard === val ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/40 border-2 border-indigo-400 scale-105' : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700'}">
                    ${val}
                  </button>
                `).join('')}
              </div>
              <button class="px-4 py-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl border border-slate-700">
                Pass / ?
              </button>
            </div>
          </div>

          <!-- SIDEBAR: AI ADVISORY & REFERENCE LIBRARY (1 Col) -->
          <div class="flex flex-col gap-6">
            ${renderAiSidebar()}
            ${renderReferenceLibrarySidebar()}
          </div>
        </div>
      `;
    }

    function renderParticipantCard(p, isRevealed) {
      const isOutlier = (state.phase === 'revealed_spread' && p.vote === '13');
      return `
        <div class="flex flex-col items-center">
          <div class="w-14 h-20 rounded-xl flex items-center justify-center font-black text-xl shadow-xl transition-all ${
            isRevealed 
              ? (isOutlier ? 'bg-rose-500/20 border-2 border-rose-500 text-rose-400 scale-105' : 'bg-indigo-600 text-white border border-indigo-400')
              : (p.voted ? 'bg-emerald-500/20 border-2 border-emerald-500 text-emerald-400' : 'bg-slate-800 border border-slate-700 text-slate-600')
          }">
            ${isRevealed ? (p.vote || '-') : (p.voted ? '✓' : '...')}
          </div>
          <div class="mt-2 text-center">
            <span class="text-xs font-semibold text-slate-200 block">${p.name}</span>
            <span class="text-[10px] text-slate-400">${p.role}</span>
          </div>
        </div>
      `;
    }

    // ==========================================
    // VARIANT B: SPLIT COMMAND CENTER (2x2 Grid)
    // ==========================================
    function renderVariantB() {
      const isRevealed = state.phase === 'revealed_spread' || state.phase === 'revealed_consensus' || state.phase === 'slicing';
      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
          <!-- LEFT 4 COLS: STORY DOCTOR & INVEST AUDIT -->
          <div class="lg:col-span-4 flex flex-col gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl flex-1 flex flex-col">
              <div class="flex items-center justify-between mb-3">
                <span class="text-xs uppercase font-bold text-indigo-400 tracking-wider">1. Story Specification</span>
                <span class="px-2 py-0.5 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded font-bold">Readiness ${state.story.readiness}%</span>
              </div>
              <h2 class="text-lg font-bold text-white">${state.story.title}</h2>
              <p class="text-xs text-slate-300 mt-2 leading-relaxed">${state.story.description}</p>
              
              <div class="mt-4 pt-4 border-t border-slate-800 space-y-3 flex-1">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">INVEST Audit</h4>
                <div class="space-y-1.5 text-xs">
                  <div class="flex items-center justify-between p-2 rounded bg-slate-800/40 border border-slate-700/50">
                    <span class="text-slate-300">Independent</span>
                    <span class="text-emerald-400 font-bold">Pass</span>
                  </div>
                  <div class="flex items-center justify-between p-2 rounded bg-slate-800/40 border border-slate-700/50">
                    <span class="text-slate-300">Testable (Acceptance Criteria)</span>
                    <span class="text-emerald-400 font-bold">3 Checklists</span>
                  </div>
                  <div class="flex items-center justify-between p-2 rounded bg-slate-800/40 border border-slate-700/50">
                    <span class="text-slate-300">Small (Slicing Risk)</span>
                    <span class="text-amber-400 font-bold">Moderate</span>
                  </div>
                </div>

                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mt-4">Edge Cases to Consider</h4>
                <div class="space-y-1 text-xs text-slate-300">
                  ${state.story.edgeCases.map(e => `
                    <label class="flex items-start gap-2 p-2 rounded hover:bg-slate-800 cursor-pointer">
                      <input type="checkbox" class="rounded bg-slate-700 border-slate-600 text-indigo-500 mt-0.5">
                      <span>${e}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <!-- CENTER 5 COLS: ESTIMATION STAGE & ROSTER -->
          <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex-1 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <span class="text-xs uppercase font-bold text-slate-400">Live Estimator Roster</span>
                  <span class="text-xs text-emerald-400 font-mono">4/4 Submitted</span>
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                  ${state.participants.map(p => `
                    <div class="p-3 rounded-xl border ${p.voted ? 'bg-slate-800/80 border-slate-700' : 'bg-slate-900 border-slate-800'} flex items-center justify-between">
                      <div>
                        <div class="text-xs font-bold text-slate-200">${p.name}</div>
                        <div class="text-[10px] text-slate-400">${p.role}</div>
                      </div>
                      <div class="w-8 h-10 rounded-lg flex items-center justify-center font-bold text-sm ${isRevealed ? 'bg-indigo-600 text-white' : 'bg-emerald-500/20 text-emerald-400'}">
                        ${isRevealed ? (p.vote || '-') : (p.voted ? '✓' : '...')}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- OUTLIER / DIVERGENCE BOX -->
              ${state.phase === 'revealed_spread' ? `
                <div class="mt-4 p-4 rounded-xl bg-rose-500/10 border border-rose-500/30">
                  <div class="flex items-center gap-2 text-rose-400 text-xs font-bold uppercase tracking-wider">
                    <i class="fa-solid fa-triangle-exclamation"></i> High Outlier: Elena (13 Points)
                  </div>
                  <p class="text-xs text-slate-300 mt-1">Elena, what hidden risks or schema migration blast radius are you seeing?</p>
                </div>
              ` : ''}

              <!-- DECK CONTROLS -->
              <div class="mt-6 pt-4 border-t border-slate-800">
                <span class="text-xs font-bold uppercase text-slate-400 block mb-2">Pick Story Card:</span>
                <div class="flex gap-1.5 justify-between">
                  ${state.deck.map(val => `
                    <button onclick="state.selectedCard = '${val}'; render();" class="flex-1 h-12 rounded-lg font-bold text-sm transition ${state.selectedCard === val ? 'bg-indigo-600 text-white border border-indigo-400' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">
                      ${val}
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>

          <!-- RIGHT 3 COLS: DIVERGENCE & VERTICAL SLICER -->
          <div class="lg:col-span-3 flex flex-col gap-6">
            ${renderAiSidebar()}
            ${renderReferenceLibrarySidebar()}
          </div>
        </div>
      `;
    }

    // ==========================================
    // VARIANT C: STREAMLINED MINIMALIST (Focus)
    // ==========================================
    function renderVariantC() {
      const isRevealed = state.phase === 'revealed_spread' || state.phase === 'revealed_consensus' || state.phase === 'slicing';
      return `
        <div class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-between gap-6">
          
          <!-- TOP STORY PILL -->
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-mono text-indigo-400">Story #101</span>
                <h2 class="text-2xl font-black text-white">${state.story.title}</h2>
              </div>
              <div class="text-right">
                <span class="text-xs text-slate-400">Readiness</span>
                <div class="text-lg font-bold text-emerald-400">${state.story.readiness}%</div>
              </div>
            </div>
            <p class="text-sm text-slate-300 mt-2">${state.story.description}</p>
          </div>

          <!-- CENTER FULL-CARD ESTIMATOR GRID -->
          <div class="grid grid-cols-4 gap-4 my-auto">
            ${state.participants.filter(p => p.role === 'Estimator' || p.id === '1').map(p => `
              <div class="bg-slate-900 border ${isRevealed && p.vote === '13' ? 'border-rose-500/80 shadow-rose-500/20' : 'border-slate-800'} rounded-2xl p-4 flex flex-col items-center justify-center min-h-[140px] shadow-xl">
                <div class="text-3xl font-black ${isRevealed ? (p.vote === '13' ? 'text-rose-400' : 'text-indigo-400') : (p.voted ? 'text-emerald-400' : 'text-slate-600')}">
                  ${isRevealed ? p.vote : (p.voted ? '✓' : '...')}
                </div>
                <div class="text-xs font-bold text-slate-300 mt-2">${p.name}</div>
              </div>
            `).join('')}
          </div>

          <!-- BOTTOM DOCKED CARD PICKER -->
          <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-2xl">
            <span class="text-xs font-bold text-slate-400 uppercase">Cast Vote:</span>
            <div class="flex gap-2">
              ${state.deck.map(val => `
                <button onclick="state.selectedCard = '${val}'; render();" class="w-14 h-16 rounded-xl font-black text-lg transition ${state.selectedCard === val ? 'bg-indigo-600 text-white scale-110 shadow-lg shadow-indigo-500/30' : 'bg-slate-800 hover:bg-slate-700 text-slate-200'}">
                  ${val}
                </button>
              `).join('')}
            </div>
            <button class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-lg transition">
              Reveal (4/4)
            </button>
          </div>
        </div>
      `;
    }

    function renderAiSidebar() {
      if (state.phase === 'story_doctor') {
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center gap-2 text-indigo-400 text-xs font-bold uppercase tracking-wider mb-2">
              <i class="fa-solid fa-stethoscope"></i> Story Doctor (Pre-Vote)
            </div>
            <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider mt-3">3-Axis Complexity</h4>
            <ul class="text-xs text-slate-400 space-y-2 mt-2">
              <li><strong class="text-slate-200">💾 Data:</strong> ${state.story.complexity.data}</li>
              <li><strong class="text-slate-200">🔌 APIs:</strong> ${state.story.complexity.apis}</li>
              <li><strong class="text-slate-200">💥 Blast:</strong> ${state.story.complexity.blast}</li>
            </ul>
          </div>
        `;
      } else if (state.phase === 'revealed_spread') {
        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center gap-2 text-rose-400 text-xs font-bold uppercase tracking-wider mb-2">
              <i class="fa-solid fa-chart-pie"></i> Divergence Analyzer
            </div>
            <p class="text-xs text-slate-300 leading-relaxed bg-slate-800/60 p-3 rounded-lg border border-slate-700/50">
              "The spread between 3 and 13 points suggests divergence on whether this requires zero-downtime schema migrations vs in-memory caching."
            </p>
            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between">
              <button onclick="setSimState('voting')" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700">
                Trigger Re-Vote
              </button>
              <button onclick="setSimState('slicing')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg">
                SPIDR Slice
              </button>
            </div>
          </div>
        `;
      } else if (state.phase === 'slicing') {
        return `
          <div class="bg-slate-900 border border-indigo-500/50 rounded-2xl p-5 shadow-xl">
            <div class="flex items-center gap-2 text-indigo-400 text-xs font-bold uppercase tracking-wider mb-2">
              <i class="fa-solid fa-scissors"></i> SPIDR Vertical Slices
            </div>
            <div class="space-y-2 mt-3 text-xs">
              <div class="p-2.5 rounded-lg bg-slate-800/80 border border-slate-700">
                <div class="font-bold text-slate-200">1. Data Model & Session Table (3 pts)</div>
                <div class="text-[10px] text-slate-400">PostgreSQL schema & migration script</div>
              </div>
              <div class="p-2.5 rounded-lg bg-slate-800/80 border border-slate-700">
                <div class="font-bold text-slate-200">2. WebSocket Reconnect Handshake (3 pts)</div>
                <div class="text-[10px] text-slate-400">Client token validation & actor reconnect</div>
              </div>
            </div>
            <button class="w-full mt-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg shadow-lg">
              Enqueue Slices & Replace Story
            </button>
          </div>
        `;
      }
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
          <div class="flex items-center gap-2 text-emerald-400 text-xs font-bold uppercase tracking-wider mb-2">
            <i class="fa-solid fa-check-double"></i> Reference Matcher
          </div>
          <p class="text-xs text-slate-400">Matched 2 historical benchmark stories (Avg: 5 Points).</p>
        </div>
      `;
    }

    function renderReferenceLibrarySidebar() {
      return `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Point Reference Library</span>
            <span class="text-[10px] text-indigo-400 font-semibold cursor-pointer">Edit</span>
          </div>
          <div class="space-y-1.5 text-xs">
            <div class="flex items-center justify-between p-1.5 rounded bg-slate-800/40"><span class="font-bold text-indigo-400">1 Pt</span><span class="text-slate-400 truncate max-w-[150px]">Minor copy or styling tweak</span></div>
            <div class="flex items-center justify-between p-1.5 rounded bg-slate-800/40"><span class="font-bold text-indigo-400">3 Pts</span><span class="text-slate-400 truncate max-w-[150px]">Standard CRUD & list view</span></div>
            <div class="flex items-center justify-between p-1.5 rounded bg-slate-800/40"><span class="font-bold text-indigo-400">5 Pts</span><span class="text-slate-400 truncate max-w-[150px]">Complex workflow / webhook</span></div>
            <div class="flex items-center justify-between p-1.5 rounded bg-slate-800/40"><span class="font-bold text-indigo-400">13 Pts</span><span class="text-slate-400 truncate max-w-[150px]">Live zero-downtime DB migration</span></div>
          </div>
        </div>
      `;
    }

    // Initial render
    render();
  </script>
</body>
